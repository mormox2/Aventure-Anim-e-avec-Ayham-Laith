<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>ارسم وحرّك مع أيهم و ليث 🎨✨🦸‍♂️</title>

        <!-- Canvas Confetti for celebrations -->
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

        <!-- Google Fonts: Changa for a playful Arabic look -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;800&display=swap" rel="stylesheet" />

    </head>

    <body
        class="rainbow-bg-glow min-h-screen text-slate-800 flex flex-col transition-colors duration-1000 overflow-y-auto pb-10"
    >
        <!-- Day/Night Decorative Background Layer -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <!-- Rainbow (Day mode) -->
            <div
                id="deco-rainbow"
                class="absolute left-1/2 -translate-x-1/2 -top-24 w-[140%] max-w-[1200px] aspect-[2/1] border-[40px] md:border-[60px] border-double rounded-full opacity-30 select-none border-t-red[...]"
            ></div>

            <!-- Floating Clouds (Day mode) -->
            <div id="deco-clouds" class="absolute inset-0">
                <svg
                    class="cloud-flow absolute top-[10%] left-0 w-28 md:w-44 text-white opacity-70 fill-current"
                    viewBox="0 0 100 60"
                    style="animation-delay: 0s; animation-duration: 35s"
                >
                    <path
                        d="M 20,40 A 20,20 0 0,1 30,10 A 25,25 0 0,1 70,15 A 20,20 0 0,1 80,40 A 15,15 0 0,1 95,55 A 5,5 0 0,1 90,60 L 10,60 A 10,10 0 0,1 10,40 Z"
                    />
                </svg>
                <svg
                    class="cloud-flow absolute top-[25%] left-0 w-20 md:w-32 text-white opacity-60 fill-current"
                    viewBox="0 0 100 60"
                    style="animation-delay: -10s; animation-duration: 25s"
                >
                    <path d="M 20,40 A 20,20 0 0,1 30,10 A 25,25 0 0,1 70,15 A 20,20 0 0,1 80,40 L 10,60 Z" />
                </svg>
                <svg
                    class="cloud-flow absolute top-[5%] left-0 w-36 md:w-56 text-white opacity-40 fill-current"
                    viewBox="0 0 100 60"
                    style="animation-delay: -18s; animation-duration: 45s"
                >
                    <path d="M 20,40 A 20,20 0 0,1 30,10 A 25,25 0 0,1 70,15 A 20,20 0 0,1 80,40 L 10,60 Z" />
                </svg>
            </div>

            <!-- Glowing Stars & Moon (Night mode - Hidden by default) -->
            <div id="deco-night" class="absolute inset-0 opacity-0 transition-opacity duration-1000">
                <!-- Big Golden Moon -->
                <svg
                    class="absolute top-[8%] right-[8%] w-24 h-24 text-yellow-200 fill-current drop-shadow-[0_0_15px_rgba(253,224,71,0.5)] sparkle-slow"
                    viewBox="0 0 100 100"
                >
                    <path d="M 60,10 A 40,40 0 1,0 90,60 A 30,30 0 1,1 60,10 Z" />
                </svg>
                <!-- Sparkly Stars -->
                <span class="sparkle-slow absolute top-[15%] left-[10%] text-yellow-300 text-3xl">⭐</span>
                <span
                    class="sparkle-slow absolute top-[35%] left-[20%] text-yellow-100 text-xl"
                    style="animation-delay: 0.5s"
                >
                    ⭐
                </span>
                <span
                    class="sparkle-slow absolute top-[20%] right-[30%] text-yellow-200 text-2xl"
                    style="animation-delay: 1.2s"
                >
                    ⭐
                </span>
                <span
                    class="sparkle-slow absolute top-[40%] right-[15%] text-yellow-300 text-lg"
                    style="animation-delay: 0.8s"
                >
                    ⭐
                </span>
                <span
                    class="sparkle-slow absolute top-[50%] left-[8%] text-yellow-200 text-2xl"
                    style="animation-delay: 1.8s"
                >
                    ⭐
                </span>
            </div>
        </div>

        <!-- Header - compact, no scroll -->
        <header
            class="relative z-10 flex items-center justify-between px-2 md:px-4 py-1 md:py-2 gap-2 select-none shrink-0"
        >
            <!-- Title Area - compact -->
            <div class="flex items-center gap-1.5 md:gap-3">
                <div
                    class="bg-yellow-400 border-2 md:border-4 border-slate-800 p-1 md:p-2 rounded-xl md:rounded-2xl shadow-cartoon rotate-[-3deg]"
                >
                    <span class="text-xl md:text-3xl">🎨</span>
                </div>
                <div class="flex flex-col text-right leading-tight">
                    <h1
                        class="text-lg md:text-3xl font-extrabold text-slate-800 drop-shadow-[0_2px_0px_white] transition-colors duration-1000"
                        id="app-title"
                    >
                        ارسم وحرّك!
                    </h1>
                    <div
                        id="app-subtitle"
                        class="flex items-center gap-1.5 md:gap-2.5 flex-wrap self-start text-[11px] md:text-sm lg:text-base"
                    >
                        <span
                            data-ui-click="celebrate-name" data-ui-name="أيهم"
                            class="inline-flex items-center gap-1 md:gap-2 font-black bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 text-slate-900 px-3 md:px-5 py-1 md:py-2 rounded[...]
                        >
                            <span class="animate-bounce">👑</span>
                            <span>أيهم</span>
                        </span>
                        <span data-role="separator" class="text-slate-500 font-black text-xs md:text-xl mx-1">&amp;</span>
                        <span
                            data-ui-click="celebrate-name" data-ui-name="ليث"
                            class="inline-flex items-center gap-1 md:gap-2 font-black bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-300 text-slate-900 px-3 md:px-5 py-1 md:py-2 rounded-full [...]
                        >
                            <span class="animate-pulse">⚡</span>
                            <span>ليث</span>
                        </span>
                        <span
                            data-ui-click="celebrate-name" data-ui-name="رسم"
                            data-role="adventure"
                            class="inline-flex items-center gap-1 font-black bg-gradient-to-r from-pink-400 via-rose-400 to-pink-500 text-white px-3 py-1 rounded-full border-3 border-slate-800 sh[...]
                        >
                            <span>✨</span>
                            <span>رسم</span>
                        </span>
                        <div id="guest-badges" class="inline-flex flex-wrap items-center gap-0.5"></div>
                    </div>
                </div>
            </div>

            <!-- Quick Utilities - compact row -->
            <div class="flex items-center gap-1 md:gap-2 overflow-x-auto shrink-0">
                <button
                    id="btn-music"
                    data-ui-click="toggle-music"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-purple-400 hover:bg-purple-300 text-slate-800 font-extrabold rounded-xl md:rounded-2xl border-2 md:border-4 border-slate-800 s[...]
                >
                    <span id="music-icon" class="text-sm md:text-xl">🔇</span>
                    <span id="music-text" class="hidden md:inline">موسيقى</span>
                </button>
                <button
                    id="btn-theme"
                    data-ui-click="toggle-theme"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-yellow-300 hover:bg-yellow-200 text-slate-800 font-extrabold rounded-xl md:rounded-2xl border-2 md:border-4 border-slate-800 s[...]
                >
                    <span id="theme-icon" class="text-sm md:text-xl">☀️</span>
                    <span id="theme-text" class="hidden md:inline">النهار</span>
                </button>
                <button
                    data-ui-click="toggle-hero-modal" data-ui-value="true"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-gradient-to-r from-red-400 via-green-400 to-blue-400 hover:from-red-300 hover:via-green-300 hover:to-blue-300 text-white font-[...]
                >
                    <span class="text-sm md:text-xl">🦸🦕</span>
                    <span class="hidden md:inline">رسومات</span>
                </button>
                <button
                    data-ui-click="toggle-friends-modal" data-ui-value="true"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-gradient-to-r from-pink-400 to-purple-400 text-white font-extrabold rounded-xl md:rounded-2xl border-2 md:border-4 border-slat[...]
                >
                    <span class="text-sm md:text-xl">👥</span>
                    <span class="hidden md:inline">أصدقاء</span>
                </button>
                <button
                    data-ui-click="toggle-gallery-modal" data-ui-value="true"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-amber-400 hover:bg-amber-300 text-slate-800 font-extrabold rounded-xl md:rounded-2xl border-2 md:border-4 border-slate-800 sha[...]
                >
                    <span class="text-sm md:text-xl">🖼️</span>
                    <span class="hidden md:inline">معرض</span>
                </button>
                <button
                    id="btn-split-mode"
                    data-ui-click="toggle-split-mode"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-gradient-to-r from-amber-400 to-cyan-400 hover:from-amber-300 hover:to-cyan-300 text-slate-800 font-extrabold rounded-xl md:ro[...]
                >
                    <span class="text-sm md:text-xl">🤝</span>
                    <span class="hidden md:inline">ثنائي</span>
                </button>
                <button
                    data-ui-click="toggle-help-modal" data-ui-value="true"
                    class="bubble-btn px-1.5 md:px-3 py-1 md:py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-800 font-extrabold rounded-xl md:rounded-2xl border-2 md:border-4 border-slate-800 shado[...]
                >
                    <span class="text-sm md:text-xl">❓</span>
                    <span class="hidden md:inline">كيف</span>
                </button>
            </div>
        </header>

        <!-- Main Game Container - NO SCROLL, fills 100% of remaining height -->
        <main class="relative z-10 flex-grow flex px-1 md:px-2 gap-1 md:gap-2 overflow-hidden min-h-0">
            <!-- LEFT SIDEBAR: Drawing Tools (compact, fixed width) -->
            <section
                class="hidden md:flex flex-col gap-1 w-40 lg:w-44 bg-amber-100/95 border-2 md:border-3 border-slate-800 rounded-2xl md:rounded-3xl p-1.5 md:p-2 shadow-cartoon-lg select-none overf[...]
            >
[...]
</html>
