<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1E293B"/>
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="16" filter="url(#shadow)"/>
  
  <!-- Painter Palette -->
  <path d="M 256 100 C 170 100, 100 170, 100 256 C 100 320, 140 375, 195 395 C 210 400, 225 390, 225 375 C 225 360, 235 348, 250 348 L 270 348 C 340 348, 396 292, 396 222 C 396 155, 333 100, 256 100 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Thumb Hole -->
  <ellipse cx="165" cy="330" rx="22" ry="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="10"/>

  <!-- Paint Dots -->
  <circle cx="165" cy="180" r="22" fill="#EF4444" stroke="#1E293B" stroke-width="8"/>
  <circle cx="230" cy="155" r="22" fill="#3B82F6" stroke="#1E293B" stroke-width="8"/>
  <circle cx="300" cy="175" r="22" fill="#10B981" stroke="#1E293B" stroke-width="8"/>
  <circle cx="345" cy="235" r="22" fill="#EC4899" stroke="#1E293B" stroke-width="8"/>
  <circle cx="320" cy="295" r="22" fill="#8B5CF6" stroke="#1E293B" stroke-width="8"/>

  <!-- Paintbrush -->
  <g transform="rotate(35 280 280)">
    <rect x="268" y="200" width="24" height="150" rx="12" fill="#D97706" stroke="#1E293B" stroke-width="8"/>
    <rect x="264" y="170" width="32" height="36" rx="4" fill="#94A3B8" stroke="#1E293B" stroke-width="8"/>
    <!-- Brush bristle & paint tip -->
    <path d="M 264 170 Q 280 120, 280 120 Q 280 120, 296 170 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M 120 120 L 126 138 L 144 144 L 126 150 L 120 168 L 114 150 L 96 144 L 114 138 Z" fill="#F59E0B" stroke="#1E293B" stroke-width="4"/>
  <path d="M 390 100 L 394 114 L 408 118 L 394 122 L 390 136 L 386 122 L 372 118 L 386 114 Z" fill="#EC4899" stroke="#1E293B" stroke-width="4"/>
</svg>
